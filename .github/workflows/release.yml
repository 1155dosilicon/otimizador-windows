name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release que recebe o .exe"
        required: true

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # No workflow_dispatch, constroi a partir da tag informada (nao da branch).
          ref: ${{ inputs.tag || github.ref }}

      - name: Gerar otimizador.exe
        shell: powershell
        run: |
          # O runner windows-latest costuma vir sem o PSGallery registrado.
          # Set-PSRepository so altera um repositorio existente e falha com
          # "No repository with the name 'PSGallery' was found" (foi o que
          # quebrou a release da v3.4.1). Registra primeiro, depois ajusta.
          if (!(Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction SilentlyContinue
          }
          if (!(Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery `
              -SourceLocation https://www.powershellgallery.com/api/v2 `
              -InstallationPolicy Trusted
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          # Install-Module precisa do provedor NuGet; bootstrap sem interacao.
          if (!(Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -ForceBootstrap -Scope CurrentUser
          }

          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck
          .\build-exe.ps1
          if (!(Test-Path .\otimizador.exe)) { exit 1 }

      - name: Anexar à release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Usa a secao da versao no CHANGELOG como notas da release (ex.: v3.4 -> "## [3.4]")
            $ver = $env:TAG.TrimStart('v')
            $cl  = Get-Content CHANGELOG.md -Raw -Encoding utf8
            if ($cl -match "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\r?\n## \[|\z)") {
              $Matches[1].Trim() | Out-File notes.md -Encoding utf8
              gh release create $env:TAG --title "Otimizador Windows $ver" --notes-file notes.md
            } else {
              gh release create $env:TAG --title "Otimizador Windows $ver" --generate-notes
            }
          }
          gh release upload $env:TAG otimizador.exe otimizador.ps1 reverter-servicos.ps1 --clobber
